---
# Idempotent: safe to re-run. Ensures each host is connected to the lab
# Red Hat account via rhc and registered/tagged in Lightspeed (Insights).
- name: Register with Red Hat Lightspeed
  hosts: all
  become: true
  tasks:
    - name: Extract sandbox ID from hostname
      ansible.builtin.set_fact:
        sandbox_id: "{{ ansible_fqdn | regex_search('sandbox-([a-z0-9]+)-', '\\1') | default(['unknown'], true) | first }}"

    - name: Display sandbox ID
      ansible.builtin.debug:
        msg: "Sandbox ID for this lab: {{ sandbox_id }}"

    # Never overwrite — a failed mid-run must not replace Satellite backup with CDN config
    - name: Save original rhsm.conf before reconfiguring
      ansible.builtin.copy:
        src: /etc/rhsm/rhsm.conf
        dest: /etc/rhsm/rhsm.conf.satellite-backup
        remote_src: true
        force: false

    - name: Unregister from subscription manager
      ansible.builtin.command:
        cmd: subscription-manager unregister
      register: rhsm_unreg
      failed_when: false
      changed_when: rhsm_unreg.rc == 0

    # rpm --nodeps avoids dnf metadata refresh against broken Satellite SSL
    - name: Remove katello-ca-consumer package without dnf
      ansible.builtin.shell: |
        set -eu
        pkgs=$(rpm -qa 'katello-ca-consumer*' || true)
        if [ -n "${pkgs}" ]; then
          rpm -e --nodeps ${pkgs}
          echo removed
        else
          echo absent
        fi
      args:
        executable: /bin/bash
      register: katello_rm
      changed_when: "'removed' in katello_rm.stdout"
      failed_when: false

    - name: Set network.fqdn in katello facts
      ansible.builtin.copy:
        dest: /etc/rhsm/facts/katello.facts
        content: '{"network.fqdn": "{{ inventory_hostname }}"}'
        mode: ug=rw,o=r

    - name: Disconnect from current RHC registration
      ansible.builtin.command:
        cmd: rhc disconnect
      register: rhc_disconnect
      failed_when: false
      changed_when: true

    - name: Point subscription-manager to Red Hat CDN for rhc connect
      ansible.builtin.command:
        cmd: >-
          subscription-manager config
          --server.hostname=subscription.rhsm.redhat.com
          --server.prefix=/subscription
          --server.port=443
          --rhsm.baseurl=https://cdn.redhat.com
      changed_when: true

    - name: Clean stale RHSM data
      ansible.builtin.command:
        cmd: subscription-manager clean
      register: rhsm_clean
      changed_when: true
      failed_when: false

    - name: Connect to correct Red Hat account via RHC
      ansible.builtin.command:
        cmd: "rhc connect --username {{ scm_username }} --password {{ scm_password }}"
      register: rhc_result
      retries: 3
      delay: 20
      until: rhc_result.rc == 0

    - name: Display RHC connection result
      ansible.builtin.debug:
        msg: "{{ rhc_result.stdout_lines }}"

    - name: Write custom tags for lab grouping
      ansible.builtin.copy:
        dest: /etc/insights-client/tags.yaml
        mode: "0644"
        content: |
          group: {{ sandbox_id }}
          lab_id: {{ sandbox_id }}
          environment: summit-lab

    # Must run while still pointed at CDN — restoring Satellite conf first breaks auth
    - name: Register with Insights and apply group tag
      ansible.builtin.command:
        cmd: "insights-client --register --group={{ sandbox_id }}"
      register: insights_result
      retries: 5
      delay: 20
      until: insights_result.rc == 0

    - name: Display Insights registration
      ansible.builtin.debug:
        msg:
          - "{{ insights_result.stdout_lines }}"
          - "Group/Tag: {{ sandbox_id }}"
          - "Account: {{ scm_username }} (org 12451665)"

    - name: Restore original rhsm.conf (keep satellite repo config)
      ansible.builtin.copy:
        src: /etc/rhsm/rhsm.conf.satellite-backup
        dest: /etc/rhsm/rhsm.conf
        remote_src: true

    # Katello CA is gone; keep Satellite repo URLs usable for the rest of the lab
    - name: Disable SSL verification in redhat.repo
      ansible.builtin.command:
        cmd: >-
          bash -c 'sed -i "s/sslverify = 1/sslverify = 0/g;
          s/sslverifystatus = 1/sslverifystatus = 0/g"
          /etc/yum.repos.d/redhat.repo'
      changed_when: true
      failed_when: false

    - name: Set sslverify=0 globally in dnf.conf
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        line: "sslverify=0"
        regexp: "^sslverify"
        state: present

    - name: Set sslverifystatus=0 globally in dnf.conf
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        line: "sslverifystatus=0"
        regexp: "^sslverifystatus"
        state: present
