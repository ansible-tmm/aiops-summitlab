---
- name: Generate OSPF Fix Playbook via LiteLLM
  hosts: localhost
  gather_facts: false
  vars:
    gitea_repo: "lightspeed_playbooks"
    gitea_user: "lab-user"
    gitea_email: "lab-user@example.org"
    llm_model: "claude-sonnet-4-6"
    lightspeed_prompt: >-
      Create an Ansible playbook named 'OSPF Fix' for host cisco-rtr1.
      Task 1: Show the status of interface Tunnel0 and register the output.
      Task 2: Administratively enable the parent interface tunnel0 when stdout contains 'administratively down'.
      Task 3: When the previous output contains 'line protocol is up' in stdout[0], run 'show ip ospf interface tunnel0' and register as new_output.
      Task 4: With two conditionals (output contains 'line protocol is up' in stdout[0] AND new_output does not contain 'Network Type POINT_TO_POINT'), configure interface tunnel0 with 'ip ospf network type point_to_point'.
      Task 5: With three conditionals (output contains 'line protocol is up' in stdout[0] AND new_output contains 'Network Type POINT_TO_POINT' AND new_output does not contain 'Hello 10'), configure interface tunnel0 with 'ip ospf hello-interval 10'.

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - gitea_url is defined
          - gitea_url | length > 0
          - llm_api_url is defined
          - llm_api_key is defined
        fail_msg: "Required variables are missing. Ensure gitea_url, llm_api_url, and llm_api_key are defined."

    - name: Send request to LiteLLM API
      ansible.builtin.uri:
        url: "{{ llm_api_url }}"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ llm_api_key }}"
        body_format: json
        body:
          model: "{{ llm_model }}"
          messages:
            - role: system
              content: >-
                You are an Ansible playbook generator. Respond with ONLY valid
                YAML for an Ansible playbook. Do not include any explanation,
                markdown formatting, or code fences. Output raw YAML only.
            - role: user
              content: "{{ lightspeed_prompt }}"
          temperature: 0.2
        timeout: 120
      register: response

    - name: Display LLM response
      ansible.builtin.debug:
        msg: "{{ response.json.choices[0].message.content }}"

    - name: Extract playbook YAML from response
      ansible.builtin.set_fact:
        raw_content: "{{ response.json.choices[0].message.content }}"

    - name: Strip markdown code fences if present
      ansible.builtin.set_fact:
        playbook_yaml: >-
          {{ raw_content | regex_replace('(?s)^```(?:yaml|yml)?\n', '') | regex_replace('\n```\s*$', '') }}

    - name: Parse and validate playbook
      ansible.builtin.set_fact:
        lightspeed_playbook: "{{ playbook_yaml | from_yaml }}"

    - name: Display generated playbook
      ansible.builtin.debug:
        msg: "{{ lightspeed_playbook | to_nice_yaml(sort_keys=False) }}"

    - name: Retrieve Gitea repository
      ansible.scm.git_retrieve:
        branch:
          duplicate_detection: false
          name: main
        origin:
          url: "https://{{ gitea_user }}:{{ gitea_password }}@{{ gitea_url | regex_replace('^https?://', '') }}/{{ gitea_user }}/{{ gitea_repo }}.git"
        parent_directory: /tmp/
      register: repository
      delegate_to: localhost
      run_once: true

    - name: Remove any existing lightspeed-response-network.yml
      ansible.builtin.file:
        state: absent
        path: "{{ repository['path'] }}/lightspeed-response-network.yml"

    - name: Publish the removal changes to Gitea
      ansible.scm.git_publish:
        path: "{{ repository['path'] }}"
        user:
          name: "{{ gitea_user }}"
          email: "{{ gitea_email }}"
      delegate_to: localhost
      run_once: true

    - name: Retrieve Gitea repository again for fresh state
      ansible.scm.git_retrieve:
        branch:
          duplicate_detection: false
          name: main
        origin:
          url: "https://{{ gitea_user }}:{{ gitea_password }}@{{ gitea_url | regex_replace('^https?://', '') }}/{{ gitea_user }}/{{ gitea_repo }}.git"
        parent_directory: /tmp/
      register: repository
      delegate_to: localhost
      run_once: true

    - name: Save generated playbook to repository
      ansible.builtin.copy:
        content: "{{ lightspeed_playbook | to_nice_yaml(sort_keys=False) }}"
        dest: "{{ repository['path'] }}/lightspeed-response-network.yml"
        mode: '0644'

    - name: Publish the new playbook to Gitea
      ansible.scm.git_publish:
        path: "{{ repository['path'] }}"
        user:
          name: "{{ gitea_user }}"
          email: "{{ gitea_email }}"
      delegate_to: localhost
      run_once: true

    - name: Display repository path
      ansible.builtin.debug:
        msg: "Playbook saved to {{ repository['path'] }}/lightspeed-response-network.yml"
